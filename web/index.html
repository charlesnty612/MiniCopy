<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniCopy</title>
<style>
/* ===================================================== v0.4.0 — 双列 UI 改版
   新结构：顶部 hero（logo + 标题 + Key 状态）+ 双列布局（左表单 / 右详情 + 任务列表）。
   - id / class 全保留（与 JS / 旧测试兼容）；所有视觉靠 CSS 变量与重定义样式达成。
   - HTML / JS 一行未动（除布局结构调整）。 */
:root {
  /* 层级背景 */
  --bg-0: #060914;
  --bg-1: #0b1220;
  --bg-2: rgba(15, 25, 45, 0.55);
  --bg-3: rgba(20, 32, 56, 0.75);
  /* 文本 */
  --fg-0: #f0f6ff;
  --fg-1: #c2d4ec;
  --fg-2: #859ab8;
  --fg-3: #54688a;
  /* 强调色 */
  --accent: #00c8ff;
  --accent-soft: rgba(0, 200, 255, 0.18);
  --accent-fg: #04121e;
  --ok: #2ee08a;
  --ok-soft: rgba(46, 224, 138, 0.16);
  --warn: #ffb547;
  --warn-soft: rgba(255, 181, 71, 0.18);
  --danger: #ff4d7e;
  --danger-soft: rgba(255, 77, 126, 0.18);
  /* 边框 + 发光 */
  --border: rgba(0, 200, 255, 0.22);
  --border-strong: rgba(0, 200, 255, 0.45);
  --glow: 0 0 20px rgba(0, 200, 255, 0.45);
  --glow-soft: 0 0 16px rgba(0, 200, 255, 0.22);
  --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--border) inset;
  /* v0.4.0 新增：分段标题与表面 */
  --surface-1: rgba(10, 18, 36, 0.6);
  --surface-2: rgba(12, 22, 42, 0.72);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { min-height: 100%; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background:
    linear-gradient(180deg, rgba(6, 9, 20, 0.55) 0%, rgba(6, 9, 20, 0.75) 100%),
    url('/assets/cyber-bg.jpg') right center / cover no-repeat,
    var(--bg-0);
  background-attachment: fixed;
  color: var(--fg-1);
  line-height: 1.55;
  padding: 24px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

h1 { font-size: 1.9rem; color: var(--fg-0); letter-spacing: 2px; font-weight: 700; line-height: 1.1; }
/* 品牌后缀（-阿米巴破局者-短视频复刻工具）：小一号、弱一档，跟主名区分层级 */
h1 .brand-suffix { font-size: 1.05rem; letter-spacing: 1px; font-weight: 600; color: var(--fg-1); margin-left: 2px; }
h2 { font-size: 1.05rem; margin: 22px 0 10px; color: var(--fg-0); font-weight: 600; letter-spacing: 0.5px; }
h3 { color: var(--fg-0); }
p.sub { color: var(--fg-2); font-size: 0.85rem; margin-top: 4px; }

/* ============ Hero 顶部横幅（logo + 标题 + Key 状态） */
.hero {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 22px;
  min-height: 150px;
  background:
    linear-gradient(135deg, rgba(6, 9, 20, 0.55) 0%, rgba(6, 9, 20, 0.78) 100%),
    url('/assets/hero-banner.jpg') center / cover no-repeat,
    var(--bg-1);
  border: 1px solid var(--border);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.08) inset;
  display: flex;
  align-items: center;
}
.hero-inner {
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  padding: 22px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-logo {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
  border: 1px solid rgba(0, 200, 255, 0.45);
  box-shadow: 0 0 14px rgba(0, 200, 255, 0.35);
  background: var(--surface-2);
}

/* ============ Cards（玻璃质感，全页背景下加深） */
.card {
  background: rgba(8, 14, 28, 0.78);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px 24px;
  margin-bottom: 18px;
  max-width: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: var(--shadow-card);
}

/* ============ Form sections (v0.4.0) — 4 个分组小标题 */
.form-section { margin-top: 18px; }
.form-section:first-of-type { margin-top: 14px; }
.form-section-title {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--accent);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding-bottom: 6px;
  border-bottom: 1px dashed rgba(0, 200, 255, 0.18);
}

/* ============ Form fields */
label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  margin: 12px 0 6px;
  color: var(--fg-2);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
label:first-of-type { margin-top: 6px; }

input[type=text], input[type=number], input[type=password], textarea, select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.92rem;
  background: rgba(8, 14, 28, 0.65);
  color: var(--fg-0);
  font-family: inherit;
  transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
}
input[type=text]:hover, input[type=number]:hover, input[type=password]:hover,
textarea:hover, select:hover { border-color: var(--border-strong); }
input[type=text]:focus, input[type=number]:focus, input[type=password]:focus,
textarea:focus, select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  background: rgba(10, 18, 36, 0.85);
}
textarea { resize: vertical; min-height: 110px; line-height: 1.55; }
input:disabled, select:disabled { background: rgba(8, 14, 28, 0.35); color: var(--fg-3); cursor: not-allowed; }

::placeholder { color: var(--fg-3); }

.row { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
.row > * { flex: 1; }

/* mode-radios 升级为分段标签卡（v0.4.0）：更大点击区域、emoji 图标、选中青色发光 */
.mode-radios {
  display: flex;
  gap: 12px;
  margin: 8px 0 6px;
  flex-wrap: wrap;
}
.mode-radios label {
  font-weight: 600;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 10px 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-1);
  color: var(--fg-1);
  text-transform: none;
  letter-spacing: 0.3px;
  font-size: 0.92rem;
  transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease, transform 120ms ease;
}
.mode-radios label:hover {
  border-color: var(--border-strong);
  background: var(--surface-2);
  transform: translateY(-1px);
}
.mode-radios label .mode-icon {
  font-size: 1.05rem;
  line-height: 1;
}
.mode-radios label:has(input[type=radio]:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--fg-0);
  box-shadow: 0 0 18px rgba(0, 200, 255, 0.45), 0 0 0 1px var(--accent) inset;
}
.mode-radios input[type=radio] {
  width: auto;
  accent-color: var(--accent);
  margin-right: 2px;
}

/* ============ Buttons */
.btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: rgba(20, 32, 56, 0.6);
  color: var(--fg-0);
  cursor: pointer;
  font-size: 0.88rem;
  font-family: inherit;
  transition: background 120ms ease, border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
}
.btn:hover {
  background: rgba(28, 44, 72, 0.8);
  border-color: var(--border-strong);
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(180deg, #00d4ff 0%, #00a8d8 100%);
  color: var(--accent-fg);
  border-color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.5px;
  box-shadow: var(--glow);
}
.btn-primary:hover {
  background: linear-gradient(180deg, #1addff 0%, #00b8e8 100%);
  box-shadow: 0 0 28px rgba(0, 200, 255, 0.65);
}
.btn-primary:disabled {
  background: rgba(0, 200, 255, 0.18);
  color: var(--fg-2);
  border-color: var(--accent-soft);
  box-shadow: none;
  font-weight: 500;
}

.btn-small { padding: 5px 12px; font-size: 0.82rem; border-radius: 5px; }

.btn-danger {
  background: rgba(255, 77, 126, 0.08);
  color: var(--danger);
  border-color: rgba(255, 77, 126, 0.5);
}
.btn-danger:hover {
  background: rgba(255, 77, 126, 0.18);
  border-color: var(--danger);
  box-shadow: 0 0 16px rgba(255, 77, 126, 0.35);
}

/* ============ Reference rows */
.ref-row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 6px;
  padding: 6px;
  background: rgba(8, 14, 28, 0.4);
  border: 1px solid rgba(0, 200, 255, 0.12);
  border-radius: 6px;
}
.ref-row input[type=text] { flex: 2; }
.ref-row select { flex: 1; min-width: 120px; }
.ref-row .btn-small { flex: 0; white-space: nowrap; }
.ref-row > input[type=file] { display: none !important; }

.media-section {
  margin: 14px 0 6px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.media-section span {
  font-size: 0.82rem;
  color: var(--fg-2);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 600;
}

/* ============ Form message */
#msg { margin: 8px 0; font-size: 0.9rem; }
#msg.ok { color: var(--ok); }
#msg.err { color: var(--danger); }

/* ============ Task list */
.task-list { list-style: none; padding: 0; margin: 0; }
.task-list li {
  padding: 12px 14px;
  margin-bottom: 6px;
  font-size: 0.88rem;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  background: rgba(8, 14, 28, 0.5);
  border: 1px solid rgba(0, 200, 255, 0.14);
  border-radius: 8px;
  border-left: 3px solid var(--fg-3);
  transition: border-color 120ms ease, background 120ms ease;
}
.task-list li:hover {
  border-color: rgba(0, 200, 255, 0.32);
  background: rgba(12, 20, 38, 0.65);
}
.task-id {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 0.78rem;
  color: var(--fg-2);
}
.task-mode {
  background: rgba(0, 200, 255, 0.10);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  border: 1px solid rgba(0, 200, 255, 0.25);
}
.task-status {
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 0.76rem;
  letter-spacing: 0.4px;
  border: 1px solid transparent;
}
.task-status.succeeded, .task-status.Success {
  background: var(--ok-soft); color: var(--ok); border-color: rgba(46, 224, 138, 0.4);
}
.task-list li:has(.task-status.succeeded), .task-list li:has(.task-status.Success) { border-left-color: var(--ok); }
.task-status.failed, .task-status.Failed {
  background: var(--danger-soft); color: var(--danger); border-color: rgba(255, 77, 126, 0.4);
}
.task-list li:has(.task-status.failed), .task-list li:has(.task-status.Failed) { border-left-color: var(--danger); }
.task-status.Queuing, .task-status.Processing, .task-status.Pending {
  background: var(--warn-soft); color: var(--warn); border-color: rgba(255, 181, 71, 0.4);
}
.task-list li:has(.task-status.Queuing), .task-list li:has(.task-status.Processing),
.task-list li:has(.task-status.Pending) { border-left-color: var(--warn); }
.ts { color: var(--fg-3); font-size: 0.75rem; }

/* task list anchors 提升对比度 */
.task-list a {
  color: var(--accent);
  text-decoration: none;
  padding: 2px 8px;
  border-radius: 4px;
  transition: background 120ms ease;
}
.task-list a:hover { background: var(--accent-soft); text-decoration: none; }

/* v0.2.3 — in-progress tasks gently pulse so users can see they're alive */
@keyframes taskPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.task-status.running,
.task-status.Processing,
.task-status.processing,
.task-status.Queuing,
.task-status.Pending,
.task-status.queued {
  animation: taskPulse 1.6s ease-in-out infinite;
}

/* v0.2.3 — delete affordance for the task list */
.task-del { color: var(--danger); margin-left: 8px; }
.task-del:hover { color: #ff8fab; background: var(--danger-soft); }

/* v0.2.3 — disabled submit button (defends against double-click submits) */
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ============ Detail panel */
.detail-json {
  background: rgba(4, 8, 18, 0.7);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 0.78rem;
  color: var(--fg-1);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 400px;
  overflow-y: auto;
}
#detail-panel { display: none; margin-top: 0; }
#detail-panel h3 { font-size: 0.98rem; margin-bottom: 10px; }
#detail-panel a { color: var(--accent); text-decoration: none; }
#detail-panel a:hover { color: #7fe0ff; }

/* v0.2.0+: Context-IR 提示词优化标记 */
.detail-ir { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.4px; }
.detail-ir.rewritten { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(46, 224, 138, 0.4); }

/* v0.4.0: 用量条改为暗色玻璃质感（替代旧浅色内联样式） */
.detail-usage {
  margin-bottom: 8px;
  padding: 8px 12px;
  background: rgba(0, 200, 255, 0.07);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.85rem;
  color: var(--fg-1);
}
.detail-usage b { color: var(--warn); }

/* checkbox */
.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-weight: 500;
  font-size: 0.85rem;
  cursor: pointer;
  color: var(--fg-1);
  text-transform: none;
  letter-spacing: 0;
}
.checkbox-label input[type=checkbox] {
  width: 16px; height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
}

/* ============ Header + API key pill（hero 内复用） */
.key-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 16px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: rgba(15, 25, 45, 0.7);
  font-size: 0.82rem;
  cursor: pointer;
  color: var(--fg-1);
  transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}
.key-pill:hover { background: rgba(28, 44, 72, 0.85); border-color: var(--border-strong); }
.key-pill .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
.key-pill.ok { color: var(--ok); border-color: rgba(46, 224, 138, 0.5); background: rgba(46, 224, 138, 0.10); }
.key-pill.ok .dot { background: var(--ok); }
.key-pill.missing { color: var(--danger); border-color: rgba(255, 77, 126, 0.5); background: rgba(255, 77, 126, 0.08); }
.key-pill.missing .dot { background: var(--danger); }

/* ============ Modal (native <dialog>) */
dialog {
  margin: auto; /* 抵消全局 *{margin:0} 复位，恢复原生 showModal 居中 */
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 22px 26px;
  width: min(520px, 92vw);
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.65), 0 0 30px rgba(0, 200, 255, 0.18);
  color: var(--fg-1);
  background: var(--bg-1);
}
dialog::backdrop {
  background: rgba(2, 6, 16, 0.75);
  backdrop-filter: blur(4px);
}
dialog h3 { margin: 0 0 8px; font-size: 1.1rem; color: var(--fg-0); }
dialog .status-line { font-size: 0.84rem; color: var(--fg-2); margin: 0 0 14px; line-height: 1.55; }
dialog .status-line code { background: rgba(0, 200, 255, 0.08); padding: 1px 6px; border-radius: 3px; font-size: 0.78rem; word-break: break-all; color: var(--accent); }
dialog .field-label { display: block; font-size: 0.8rem; font-weight: 600; margin: 0 0 6px; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.5px; }
dialog input[type=password] { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.94rem; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; box-sizing: border-box; background: rgba(8, 14, 28, 0.75); color: var(--fg-0); }
dialog input[type=password]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
dialog .field-hint { font-size: 0.75rem; color: var(--fg-3); margin: 6px 0 0; line-height: 1.55; }
dialog .key-msg { font-size: 0.85rem; min-height: 1.2em; margin: 10px 0 0; }
dialog .key-msg.err { color: var(--danger); }
dialog .key-msg.ok { color: var(--ok); }
dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ============ IR status pills */
.ir-status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.4px; border: 1px solid transparent; }
.ir-status.rewritten { background: var(--ok-soft); color: var(--ok); border-color: rgba(46, 224, 138, 0.4); }
.ir-status.fallback { background: var(--warn-soft); color: var(--warn); border-color: rgba(255, 181, 71, 0.4); }
.ir-status.disabled { background: rgba(120, 140, 170, 0.14); color: var(--fg-2); border-color: rgba(120, 140, 170, 0.3); }

details.advanced { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
details.advanced summary { cursor: pointer; font-size: 0.85rem; color: var(--accent); padding: 4px 0; }
details.advanced summary:hover { color: #7fe0ff; }
details.advanced[open] summary { margin-bottom: 10px; }

/* submit-row 加大（v0.4.0） */
#submit-row { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
#submit-row .btn-primary {
  padding: 12px 28px;
  font-size: 1rem;
}

/* ============ Layout: 双列（左表单 / 右详情+任务），max-width 1320px 居中 */
.layout {
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(360px, 0.9fr);
  gap: 20px;
  align-items: start;
}
.main-col { display: flex; flex-direction: column; min-width: 0; }
.right-col { display: flex; flex-direction: column; gap: 0; min-width: 0; position: sticky; top: 20px; }

/* 必填字段红星 + 错误高亮 */
label[data-required="true"]::after {
  content: " *";
  color: var(--danger);
  font-weight: 700;
  margin-left: 2px;
}
.is-error, .is-error:focus {
  border-color: var(--danger) !important;
  box-shadow: 0 0 0 3px var(--danger-soft) !important;
  background: rgba(255, 77, 126, 0.06) !important;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
.is-error { animation: shake 280ms ease-out; }

/* duration summary inline note */
#duration-summary { color: var(--fg-3); font-size: 0.82em; margin-left: 8px; }

/* link 色彩统一到主色 — 包括页面内所有未在更具体选择器覆盖的 a */
a { color: var(--accent); }
a:hover { color: #7fe0ff; }

/* ============ Footer */
.page-footer {
  width: 100%;
  max-width: 1320px;
  margin: 12px auto 0;
  text-align: center;
  font-size: 0.78rem;
  color: var(--fg-3);
  letter-spacing: 0.5px;
}

/* ============ Responsive: 窄屏塌为单列 */
@media (max-width: 980px) {
  body { padding: 14px; }
  h1 { font-size: 1.4rem; letter-spacing: 1px; }
  h1 .brand-suffix { font-size: 0.85rem; display: block; margin-left: 0; margin-top: 2px; }
  .hero { min-height: 120px; }
  .hero-inner { padding: 16px 18px; }
  .brand-logo { width: 40px; height: 40px; }
  .key-pill { font-size: 0.75rem; padding: 4px 10px; }
  .layout {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .right-col { position: static; }
  .card { padding: 16px 16px; }
  .task-list li { font-size: 0.82rem; padding: 10px 12px; }
  .task-id { font-size: 0.72rem; word-break: break-all; }
  dialog { width: min(440px, 94vw); padding: 18px 18px; }
  .mode-radios label { padding: 8px 14px; font-size: 0.85rem; }
  input[type=text], input[type=number], textarea, select { font-size: 0.95rem; }
  #submit-row .btn-primary { padding: 10px 22px; font-size: 0.95rem; }
}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <img class="brand-logo" src="/assets/logo.png" alt="MiniCopy">
      <div>
        <h1>MiniCopy<span class="brand-suffix">-阿米巴破局者-短视频复刻工具</span></h1>
        <p class="sub">MiniMax H3 视频生成 · 本地 UI</p>
      </div>
    </div>
    <button id="key-pill" class="key-pill missing" onclick="openKeyDialog()" title="点击配置 API Key">
      <span class="dot"></span><span id="key-pill-label">API Key: 未配置</span>
    </button>
  </div>
</header>

<dialog id="key-dialog">
  <h3>配置 API Key</h3>
  <div class="status-line" id="key-status-line">加载中…</div>
  <label class="field-label" for="key-input">输入新 Key</label>
  <input type="password" id="key-input" placeholder="eyJhbGciOi..." autocomplete="off" />
  <p class="field-hint">Key 保存在本机用户配置目录（<code id="key-save-path">%APPDATA%\minipic\config.json</code>），明文存盘。</p>
  <p class="key-msg" id="key-msg"></p>
  <div class="actions">
    <button class="btn" onclick="closeKeyDialog()">取消</button>
    <button class="btn btn-primary" id="key-save-btn" onclick="saveKey()">保存</button>
  </div>
</dialog>

<div class="layout">
<div class="main-col">
<div class="card form-card">
  <h2>创建任务</h2>

  <div class="mode-radios">
    <label><input type="radio" name="mode" value="t2v"> <span class="mode-icon">📝</span> t2v（文生视频）</label>
    <label><input type="radio" name="mode" value="i2v"> <span class="mode-icon">🖼</span> i2v（首帧图生视频）</label>
    <label><input type="radio" name="mode" value="r2v" checked> <span class="mode-icon">🎞</span> r2v（多模态参考）</label>
  </div>

  <div class="form-section">
    <span class="form-section-title">基本设置</span>

    <label for="model">模型</label>
    <select id="model">
      <option value="MiniMax-H3" selected>MiniMax-H3（默认 · 768P/2K · 4-15s · 全能力 · 首帧/尾帧）</option>
      <option value="MiniMax-H3-Max">MiniMax-H3-Max（480P/768P · 5-15s · 无多模态参考 · 首帧/尾帧）</option>
    </select>

    <label for="prompt" data-required="true">提示词</label>
    <textarea id="prompt" placeholder="描述你想生成的视频内容"></textarea>

    <label for="duration">时长（秒，<span id="duration-range-label">4-15</span>）</label>
    <input type="number" id="duration" value="10" min="4" max="15" title="单段生成的时长（≤15s，H3 上限）。">
    <span id="duration-summary" style="margin-left:8px;color:#666;font-size:0.9em;"></span>
  </div>

  <div class="form-section">
    <span class="form-section-title">画面参数</span>

    <label for="ratio">比例（t2v 专用）</label>
    <select id="ratio">
      <option value="">-- 选择比例 --</option>
      <option value="adaptive">adaptive</option>
      <option value="16:9">16:9</option>
      <option value="9:16">9:16</option>
      <option value="1:1">1:1</option>
      <option value="4:3">4:3</option>
      <option value="3:4">3:4</option>
      <option value="21:9">21:9</option>
    </select>

    <label for="resolution">分辨率</label>
    <select id="resolution">
      <option value="768P" selected>768P</option>
      <option value="2K">2K</option>
      <option value="480P">480P</option>
    </select>
  </div>

  <div class="form-section">
    <span class="form-section-title">参考素材</span>

    <!-- i2v: first_frame（必填）+ 可选 last_frame（首+尾帧组合） -->
    <div id="i2v-row" style="display:none">
      <label data-required="true">首帧图路径（first_frame）</label>
      <div class="ref-row" id="i2v-first-row">
        <input type="text" id="i2v-first-path" placeholder="/path/to/image.png">
        <button type="button" class="btn btn-small" onclick="pickFile(this, 'image/png,image/jpeg,image/webp,image/heic,image/heif')">📎</button>
        <input type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" style="display:none" onchange="uploadFile(this)">
      </div>
      <label style="margin-top:10px">尾帧图路径（last_frame，可选；首+尾帧组合时填写）</label>
      <div class="ref-row" id="i2v-last-row">
        <input type="text" id="i2v-last-path" placeholder="/path/to/image.png（可选）">
        <button type="button" class="btn btn-small" onclick="pickFile(this, 'image/png,image/jpeg,image/webp,image/heic,image/heif')">📎</button>
        <input type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" style="display:none" onchange="uploadFile(this)">
      </div>
    </div>

    <!-- r2v: dynamic media rows -->
    <div id="r2v-section" style="display:none">
      <div class="media-section">
        <span>参考图：</span>
        <button class="btn btn-small" onclick="addRef('image')">+ 图片</button>
      </div>
      <div id="ref-images"></div>

      <div class="media-section">
        <span>参考视频：</span>
        <button class="btn btn-small" onclick="addRef('video')">+ 视频</button>
      </div>
      <div id="ref-videos"></div>

      <div class="media-section">
        <span>参考音频：</span>
        <button class="btn btn-small" onclick="addRef('audio')">+ 音频</button>
      </div>
      <div id="ref-audios"></div>
    </div>
  </div>

  <div class="form-section">
    <span class="form-section-title">生成选项</span>

    <label class="checkbox-label">
      <input type="checkbox" id="wait">
      <span>等待结果（阻塞请求直到视频生成完成，可能需要 15-30 分钟）</span>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" id="use-context-ir" checked>
      <span>使用 Context-IR 优化提示词（H3 默认开启 · H3-Max 自动跳过 · 失败时回退原文）</span>
    </label>
  </div>

  <div id="submit-row">
    <button class="btn btn-primary" id="submit-btn" onclick="submitTask()">提交</button>
    <span id="msg"></span>
  </div>
</div>
</div><!-- /main-col -->

<aside class="right-col">
  <div class="card" id="detail-panel">
    <h3>任务详情</h3>
    <div id="detail-ir" style="display:none;margin-bottom:8px"></div>
    <div id="detail-usage" class="detail-usage" style="display:none"></div>
    <div id="detail-json" class="detail-json"></div>
    <p style="margin-top:8px;font-size:0.85rem">
      <span id="detail-dl-btn"></span>
      <button class="btn btn-small" onclick="closeDetail()" style="margin-left:8px">关闭</button>
    </p>
  </div>

  <div class="card">
    <h2>最近任务 <button class="btn btn-small" onclick="loadTasks()" style="margin-left:12px">刷新</button></h2>
    <ul class="task-list" id="task-list"><li style="color:#999">加载中…</li></ul>
  </div>
</aside>
</div><!-- /layout -->

  <footer class="page-footer">MiniCopy · MiniMax H3 本地 UI · <span id="footer-ver"></span></footer>

<script>
const BASE = '/api';
let taskCount = 0;
// v0.2.3 — detail-panel state for auto-refreshing a task's status while it's
// still non-terminal. A setTimeout (not setInterval) means the next poll is
// only armed after the current fetch settles, so we never pile up requests.
let currentDetailId = null;
let detailPollTimer = null;

function $(id) { return document.getElementById(id); }

function getMode() { return document.querySelector('input[name="mode"]:checked').value; }

// Toggle visibility of mode-specific fields
document.querySelectorAll('input[name="mode"]').forEach(function(el) {
  el.addEventListener('change', updateModeUI);
});

function updateModeUI() {
  const m = getMode();
  $('i2v-row').style.display = m === 'i2v' ? 'block' : 'none';
  $('r2v-section').style.display = m === 'r2v' ? 'block' : 'none';
  $('ratio').disabled = m !== 't2v';
}
updateModeUI();

// Dynamic ref row management
function addRef(type) {
  const containerId = type === 'image' ? 'ref-images' : type === 'video' ? 'ref-videos' : 'ref-audios';
  const container = $(containerId);
  const row = document.createElement('div');
  row.className = 'ref-row';

  if (type === 'image') {
    row.innerHTML =
      '<input type="text" placeholder="/path/to/image.png">' +
      '<select>' +
        '<option value="reference_image" selected>reference_image</option>' +
      '</select>' +
      '<button type="button" class="btn btn-small" onclick="pickFile(this, \'image/png,image/jpeg,image/webp,image/heic,image/heif\')">📎</button>' +
      '<input type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" style="display:none" onchange="uploadFile(this)">' +
      '<button class="btn btn-small btn-danger" onclick="this.parentNode.remove()">×</button>';
  } else if (type === 'video') {
    row.innerHTML =
      '<input type="text" placeholder="/path/to/video.mp4">' +
      '<button type="button" class="btn btn-small" onclick="pickFile(this, \'video/mp4,video/quicktime\')">📎</button>' +
      '<input type="file" accept="video/mp4,video/quicktime" style="display:none" onchange="uploadFile(this)">' +
      '<button class="btn btn-small btn-danger" onclick="this.parentNode.remove()">×</button>';
  } else {
    row.innerHTML =
      '<input type="text" placeholder="/path/to/audio.mp3">' +
      '<button type="button" class="btn btn-small" onclick="pickFile(this, \'audio/mpeg,audio/wav\')">📎</button>' +
      '<input type="file" accept="audio/mpeg,audio/wav" style="display:none" onchange="uploadFile(this)">' +
      '<button class="btn btn-small btn-danger" onclick="this.parentNode.remove()">×</button>';
  }
  container.appendChild(row);
}

function buildPayload() {
  const mode = getMode();
  const payload = {
    mode: mode,
    model: $('model').value,
    prompt: $('prompt').value.trim(),
    duration: parseInt($('duration').value, 10),
    resolution: $('resolution').value,
    ratio: mode === 'i2v' ? null : $('ratio').value || null,
    ref_images: [],
    ref_videos: [],
    ref_audios: [],
    wait: $('wait').checked,
    use_context_ir: $('use-context-ir').checked,
  };

  if (mode === 'i2v') {
    // i2v 固定为 first_frame（必填） + 可选 last_frame；角色不再有下拉。
    const firstPath = $('i2v-first-path').value.trim();
    const lastPath = $('i2v-last-path').value.trim();
    if (firstPath) {
      payload.ref_images.push({ path: firstPath, role: 'first_frame' });
    }
    if (lastPath) {
      payload.ref_images.push({ path: lastPath, role: 'last_frame' });
    }
  } else if (mode === 'r2v') {
    $('ref-images').querySelectorAll('.ref-row').forEach(function(row) {
      const path = row.querySelector('input').value.trim();
      if (path) {
        payload.ref_images.push({
          path: path,
          role: row.querySelector('select') ? row.querySelector('select').value : 'reference_image',
        });
      }
    });
    $('ref-videos').querySelectorAll('.ref-row').forEach(function(row) {
      const path = row.querySelector('input').value.trim();
      if (path) {
        payload.ref_videos.push({ path: path });
      }
    });
    $('ref-audios').querySelectorAll('.ref-row').forEach(function(row) {
      const path = row.querySelector('input').value.trim();
      if (path) payload.ref_audios.push({ path: path });
    });
  }
  return payload;
}

function setMsg(text, isErr) {
  const el = $('msg');
  el.textContent = text;
  el.className = isErr ? 'err' : 'ok';
}

// ============================================================ v0.1.5 single-segment submit
function flashError(fieldId) {
  const el = $(fieldId); if (!el) return;
  el.classList.remove('is-error');
  // force reflow so the animation re-triggers
  void el.offsetWidth;
  el.classList.add('is-error');
  el.focus();
  setTimeout(function() { el.classList.remove('is-error'); }, 2200);
}

async function submitTask() {
  // v0.2.3 — guard against accidental double-clicks that produce duplicate
  // (paid) MiniMax tasks. The button stays disabled for the entire round
  // trip; finally restores state so the user can tweak & re-submit.
  const btn = $('submit-btn');
  if (btn.disabled) return;
  setMsg('', false);
  const payload = buildPayload();
  if (!payload.prompt) { setMsg('请填写提示词', true); flashError('prompt'); return; }
  if (payload.mode === 'i2v' && payload.ref_images.length === 0) {
    setMsg('请填写首帧图路径', true); flashError('i2v-first-path'); return;
  }
  btn.disabled = true;
  const origText = btn.textContent;
  btn.textContent = '⏳ 提交中…';
  setMsg('正在提交：上传素材 → 优化提示词 → 创建任务，请勿重复点击…' + (payload.wait ? '（已勾选等待结果，可能需 15-30 分钟）' : ''), false);
  try {
    const res = await fetch(BASE + '/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      setMsg('错误: ' + (data.detail || data.error || res.status), true);
      return;
    }
    setMsg('已提交，task_id: ' + data.task_id, false);
    $('detail-dl-btn').innerHTML =
      '<a href="#" onclick="showTask(\'' + data.task_id + '\');return false">查看状态</a>';
    showTask(data.task_id);
    loadTasks();
  } catch(e) {
    setMsg('网络错误: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
}

// ============================================================ v0.1.4 file upload helpers
async function uploadFile(fileInput) {
  const file = fileInput.files[0]; if (!file) return;
  const btn = fileInput.previousElementSibling;
  // text input is always the first <input type=text> sibling of the picker button
  const txtInput = fileInput.parentNode.querySelector('input[type=text]');
  const isVideo = /^video\//.test(file.type);
  const origText = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳';
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await fetch(BASE + '/upload', { method: 'POST', body: fd });
    if (!r.ok) {
      let msg = r.statusText;
      try { msg = (await r.json()).detail || msg; } catch (_) {}
      throw new Error(msg);
    }
    const data = await r.json();
    if (txtInput) txtInput.value = data.path;
    // For video uploads, auto-fill the duration input only if the user hasn't
    // typed one yet. Probe via /api/probe/video (ffprobe under the hood).
    if (isVideo) maybeAutofillDuration(data.path);
    updateDurationSummary();
  } catch (e) { alert('上传失败: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = origText; fileInput.value = ''; }
}

async function maybeAutofillDuration(path) {
  const durInput = document.getElementById('duration');
  if (!durInput) return;
  try {
    const r = await fetch(BASE + '/probe/video?path=' + encodeURIComponent(path));
    if (!r.ok) return;  // probe is best-effort; silently skip on failure.
    const data = await r.json();
    const seconds = Number(data.duration);
    if (!Number.isFinite(seconds) || seconds <= 0) return;
    // Clamp to model max (15s for H3) — single segments can't exceed that.
    const capped = Math.min(15, Math.max(5, Math.round(seconds)));
    durInput.value = String(capped);
    if (seconds > 15.5) {
      alert(
        `参考视频 ${seconds.toFixed(1)}s 超过 15s 上限，H3 已不支持多段生成，` +
        `请先截取到 ≤15s 再提交`
      );
    }
    updateDurationSummary();
  } catch (_) { /* silent */ }
}

function pickFile(btn, accept) {
  const fi = btn.nextElementSibling;
  if (accept) fi.accept = accept;
  fi.click();
}

async function loadTasks() {
  try {
    const res = await fetch(BASE + '/tasks');
    const tasks = await res.json();
    const ul = $('task-list');
    if (!tasks || tasks.length === 0) {
      ul.innerHTML = '<li style="color:#999">暂无任务</li>';
      return;
    }
    // v0.2.3 — translate raw API status tokens to Chinese for the user-facing
    // label. The CSS class still uses the raw token so the existing colour
    // rules (.task-status.succeeded / .Processing / ...) keep matching.
    const STATUS_CN = {
      running: '进行中',
      processing: '处理中',
      Processing: '处理中',
      queued: '排队中',
      Queuing: '排队中',
      Pending: '排队中',
      submitted: '已提交',
      succeeded: '已完成',
      Success: '已完成',
      failed: '失败',
      Failed: '失败',
    };
    ul.innerHTML = tasks.map(function(t) {
      const time = new Date(t.submitted_at).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});
      const dl = (t.output_path || (t.status === 'Success' || t.status === 'succeeded'))
        ? '<a href="#" onclick="downloadTask(\'' + t.task_id + '\');return false">下载</a>'
        : '';
      const cnLabel = STATUS_CN[t.status] || t.status;
      return '<li>' +
        '<span class="task-id">' + escHtml(t.task_id) + '</span> ' +
        '<span class="task-mode">' + escHtml(t.mode) + '</span> ' +
        '<span class="task-status ' + escHtml(t.status) + '">' + escHtml(cnLabel) + '</span> ' +
        '<span class="ts">' + time + '</span> ' +
        '<a href="#" onclick="showTask(\'' + t.task_id + '\');return false">详情</a> ' +
        '<a href="#" class="task-del" onclick="deleteTask(\'' + t.task_id + '\', \'' + escHtml(t.status) + '\');return false">删除</a> ' +
        dl +
      '</li>';
    }).join('');
  } catch(e) {
    $('task-list').innerHTML = '<li style="color:#c00">加载失败: ' + escHtml(e.message) + '</li>';
  }
}

async function showTask(taskId) {
  // v0.2.3 — claim the detail panel for this task and cancel any previous
  // pending poll so we never have overlapping fetches in flight.
  currentDetailId = taskId;
  if (detailPollTimer) { clearTimeout(detailPollTimer); detailPollTimer = null; }
  try {
    const res = await fetch(BASE + '/tasks/' + taskId);
    if (!res.ok) {
      alert('任务不存在'); return;
    }
    const t = await res.json();
    $('detail-json').textContent = JSON.stringify(t, null, 2);
    // Context-IR 提示词优化标记（仅当后端持久化了 used_context_ir 时显示）
    const irBox = $('detail-ir');
    const usedIR = !!(t.extra && t.extra.used_context_ir);
    if (usedIR) {
      irBox.innerHTML = '<span class="detail-ir rewritten">\u2728 \u63d0\u793a\u8bcd\u5df2\u7531 Context-IR \u4f18\u5316</span>';
      irBox.style.display = 'block';
    } else {
      irBox.style.display = 'none';
    }
    // 用量 / 费用展示（usage 由后端从 API 响应持久化到 extra）
    const usageBox = $('detail-usage');
    const usage = (t.extra && t.extra.usage) || t.usage;
    if (usage && (usage.total_seconds != null || usage.output_seconds != null)) {
      const totalSec = Number(usage.total_seconds || usage.output_seconds || 0);
      // 按分辨率估算费用（国内官方刊例价）：768P ¥0.50/s、2K ¥0.80/s；480P 无公开单价，用 768P 近似
      const rate = (t.resolution === '2K') ? 0.80 : 0.50;
      const cost = (totalSec * rate).toFixed(2);
      usageBox.innerHTML =
        '⏱ 生成时长 ' + totalSec + 's' +
        '（输入 ' + (usage.input_seconds != null ? usage.input_seconds + 's' : '—') +
        ' / 输出 ' + (usage.output_seconds != null ? usage.output_seconds + 's' : '—') + '）' +
        ' · 估算费用 <b>¥' + cost + '</b>';
      usageBox.style.display = 'block';
    } else {
      usageBox.style.display = 'none';
    }
    let dl = '';
    const url = t.content_url || t.output_path;
    if (url) {
      dl = '<a href="/api/tasks/' + taskId + '/download">下载视频</a>';
    }
    $('detail-dl-btn').innerHTML = dl;
    $('detail-panel').style.display = 'block';

    // v0.2.3 — non-terminal tasks get an auto-refresh so the user can watch
    // progress without re-clicking 详情. Terminal states stop the loop.
    if (!/success|fail/i.test(t.status) && currentDetailId === taskId) {
      detailPollTimer = setTimeout(function() {
        // Only re-fire if the user is still looking at *this* task and the
        // panel is still visible (closeDetail() flips both to null/false).
        if ($('detail-panel').style.display === 'block' && currentDetailId === taskId) {
          showTask(taskId);
        }
      }, 10000);
    }
  } catch(e) {
    alert('加载失败: ' + e.message);
  }
}

function closeDetail() {
  // v0.2.3 — also cancel any in-flight auto-refresh timer.
  currentDetailId = null;
  if (detailPollTimer) { clearTimeout(detailPollTimer); detailPollTimer = null; }
  $('detail-panel').style.display = 'none';
}

function downloadTask(taskId) {
  window.location.href = '/api/tasks/' + taskId + '/download';
}

// v0.2.3 — remove the local SQLite record for a task. The MiniMax-side job
// keeps running if it's still in flight (the V2 API has no cancel endpoint),
// so we warn the user explicitly before doing this.
async function deleteTask(taskId, status) {
  const running = !/success|fail/i.test(status);
  const tip = running
    ? '该任务仍在进行中。\n删除只移除本地记录，MiniMax 侧仍会继续生成并计费（API 不支持取消）。\n确定删除？'
    : '确定删除该任务记录？\n（不会删除已下载的视频文件）';
  if (!confirm(tip)) return;
  try {
    const res = await fetch(BASE + '/tasks/' + taskId, { method: 'DELETE' });
    if (!res.ok) { setMsg('删除失败: ' + res.status, true); return; }
    if (currentDetailId === taskId) closeDetail();
    loadTasks();
  } catch(e) { setMsg('删除失败: ' + e.message, true); }
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Poll
loadTasks();
// v0.2.3 — was 5s in older builds, slowed to 10s; skip when tab is hidden
// so a background tab doesn't burn MiniMax quota.
setInterval(function() { if (!document.hidden) loadTasks(); }, 10000);

// -------- API Key dialog --------
let modelConstraints = null;  // populated by loadConfigStatus()

function updateDurationSummary() {
  const summary = $('duration-summary');
  if (!summary) return;
  const durInput = $('duration');
  if (durInput) {
    // Always enabled in v0.1.5+ (no multi-segment path).
    durInput.disabled = false;
    durInput.title = '单段生成的时长（≤15s，H3 上限）';
  }
  const refPaths = Array.from(document.querySelectorAll('#ref-videos .ref-row input[type=text]'))
    .map(function(i) { return i.value.trim(); })
    .filter(Boolean);
  if (refPaths.length === 0) {
    summary.textContent = '';
    return;
  }
  // Single-segment mode: just report the reference video's duration. Warn the
  // user if it exceeds H3's 15s cap (multi-segment generation was removed).
  fetch(BASE + '/probe/video?path=' + encodeURIComponent(refPaths[0]))
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      if (!d || !Number.isFinite(d.duration)) { summary.textContent = ''; return; }
      const ref = d.duration;
      const overCap = ref > 15 + 0.05;
      summary.textContent = overCap
        ? `参考视频 ${ref.toFixed(1)}s — 超过 15s 上限，请先截取到 ≤15s`
        : `参考视频 ${ref.toFixed(1)}s`;
    })
    .catch(function() { summary.textContent = ''; });
}

function applyModelConstraints() {
  if (!modelConstraints) return;
  const model = $('model').value;
  const c = modelConstraints[model];
  if (!c) return;

  // duration range
  const dur = $('duration');
  dur.min = c.duration_min;
  dur.max = c.duration_max;
  $('duration-range-label').textContent = c.duration_min + '-' + c.duration_max;
  if (parseInt(dur.value, 10) < c.duration_min) dur.value = c.duration_min;
  if (parseInt(dur.value, 10) > c.duration_max) dur.value = c.duration_max;

  // resolution options — keep only the ones this model supports
  const res = $('resolution');
  const prev = res.value;
  res.innerHTML = '';
  c.resolutions.forEach(function(r, i) {
    const opt = document.createElement('option');
    opt.value = r;
    opt.textContent = r;
    if ((i === 0 && !c.resolutions.includes(prev)) || r === prev) {
      opt.selected = true;
    } else if (i === 0) {
      opt.selected = true;
    }
    res.appendChild(opt);
  });

  // 模式能力联动：所选模型不支持当前 mode → 自动回退到 t2v。
  const currentMode = getMode();
  const modes = c.modes || ['t2v', 'i2v', 'r2v'];
  if (currentMode === 'r2v' && modes.indexOf('r2v') === -1) {
    document.querySelector('input[name="mode"][value="t2v"]').checked = true;
    alert('H3-Max 不支持多模态参考（r2v），已自动切换到 t2v');
    updateModeUI();
  }

  // i2v 角色已固定为首帧 + 可选尾帧（v0.1.6+），无需再按模型动态重建。
  // i2v_roles 字段保留在 /api/config 响应里供上层使用。

  updateDurationSummary();
}

// rebuildI2vRoleOptions 已废弃（i2v 角色固定）；保留为空 stub 以便未来扩展时查找。
function rebuildI2vRoleOptions(_roles) { /* no-op since v0.1.6 */ }

async function loadConfigStatus() {
  try {
    const res = await fetch(BASE + '/config');
    if (!res.ok) return;
    const cfg = await res.json();
    // v0.2.2+: surface server version in the page footer
    if (cfg.version) $('footer-ver').textContent = 'v' + cfg.version;
    // Build modelConstraints map
    modelConstraints = {};
    cfg.models.forEach(function(m) {
      modelConstraints[m.name] = {
        resolutions: m.resolutions,
        duration_min: m.duration_min,
        duration_max: m.duration_max,
        modes: m.modes || ['t2v', 'i2v', 'r2v'],
        i2v_roles: m.i2v_roles || ['first_frame', 'last_frame'],
      };
    });
    // Update pill
    const pill = $('key-pill');
    const lbl = $('key-pill-label');
    if (cfg.has_key) {
      pill.classList.remove('missing');
      pill.classList.add('ok');
      // v0.2.0+: UI 只认用户配置；source 仅可能为 "user" / "none"。
      // 保留 env/local 分支作为防御性兜底（万一后端未来扩展）。
      const srcLabel = cfg.source === 'user'  ? '（用户配置）'
                    : cfg.source === 'local' ? '（local config.json）'
                    : cfg.source === 'env'   ? '（环境变量兜底 · MINIMAX_API_KEY）'
                    : '';
      lbl.textContent = 'API Key: ' + cfg.masked + ' ' + srcLabel;
      pill.title = '来源: ' + cfg.source;
    } else {
      pill.classList.remove('ok');
      pill.classList.add('missing');
      lbl.textContent = 'API Key: 未配置 · 点击填写';
    }
    // Save path hint
    const p = $('key-save-path');
    if (p && cfg.user_config_path) p.textContent = cfg.user_config_path;

    applyModelConstraints();
  } catch(e) { /* ignore */ }
}

function openKeyDialog() {
  $('key-input').value = '';
  $('key-msg').textContent = '';
  $('key-msg').className = '';
  $('key-status-line').textContent = '请输入你的 MiniMax API Key';
  $('key-dialog').showModal();
  setTimeout(function() { $('key-input').focus(); }, 50);
}

function closeKeyDialog() {
  $('key-dialog').close();
}

async function saveKey() {
  const key = $('key-input').value.trim();
  if (!key) { setKeyMsg('请输入 Key', true); return; }
  const btn = $('key-save-btn');
  btn.disabled = true;
  btn.textContent = '保存中…';
  try {
    const res = await fetch(BASE + '/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ api_key: key }),
    });
    const data = await res.json();
    if (!res.ok) { setKeyMsg('保存失败: ' + (data.detail || res.status), true); return; }
    setKeyMsg('已保存到 ' + data.saved_to, false);
    $('key-input').value = '';
    await loadConfigStatus();
    setTimeout(closeKeyDialog, 600);
  } catch(e) {
    setKeyMsg('网络错误: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
  }
}

function setKeyMsg(text, isErr) {
  const el = $('key-msg');
  el.textContent = text;
  el.className = 'key-msg ' + (isErr ? 'err' : 'ok');
}

// Wire model select
$('model').addEventListener('change', applyModelConstraints);

// Wire duration input — recompute duration summary on every keystroke.
$('duration').addEventListener('input', updateDurationSummary);

loadConfigStatus();
</script>
</body>
</html>
