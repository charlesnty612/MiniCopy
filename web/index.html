<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>minipic</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f7f7f7; color: #222; line-height: 1.5; padding: 24px; }
h1 { font-size: 1.4rem; margin-bottom: 4px; }
h2 { font-size: 1.1rem; margin: 24px 0 8px; }
p.sub { color: #666; font-size: 0.85rem; margin-bottom: 20px; }

.card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 16px; max-width: 640px; }

label { display: block; font-size: 0.85rem; font-weight: 600; margin: 10px 0 4px; color: #333; }

input[type=text], input[type=number], textarea, select { width: 100%; padding: 6px 8px; border: 1px solid #bbb; border-radius: 4px; font-size: 0.9rem; }
textarea { resize: vertical; min-height: 80px; font-family: inherit; }
input:disabled, select:disabled { background: #eee; color: #888; }

.row { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
.row > * { flex: 1; }

.mode-radios { display: flex; gap: 16px; margin: 8px 0; }
.mode-radios label { font-weight: normal; margin: 0; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.mode-radios input[type=radio] { width: auto; }

.btn { padding: 7px 16px; border: 1px solid #bbb; border-radius: 4px; background: #eee; cursor: pointer; font-size: 0.85rem; }
.btn:hover { background: #ddd; }
.btn-primary { background: #0066cc; color: #fff; border-color: #0055aa; }
.btn-primary:hover { background: #0055aa; }
.btn-small { padding: 4px 10px; font-size: 0.8rem; }
.btn-danger { background: #fff; color: #c00; border-color: #c00; }
.btn-danger:hover { background: #fee; }

.ref-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.ref-row input[type=text] { flex: 2; }
.ref-row select { flex: 1; min-width: 120px; }
.ref-row .btn-small { flex: 0; white-space: nowrap; }

.media-section { margin: 10px 0 4px; display: flex; gap: 6px; align-items: center; }
.media-section span { font-size: 0.8rem; color: #555; }

#msg { margin: 8px 0; font-size: 0.9rem; }
#msg.ok { color: #060; }
#msg.err { color: #c00; }

.task-list { list-style: none; }
.task-list li { border-bottom: 1px solid #eee; padding: 8px 0; font-size: 0.85rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.task-list li:last-child { border-bottom: none; }
.task-id { font-family: monospace; font-size: 0.8rem; color: #555; }
.task-mode { background: #e8f0ff; padding: 1px 5px; border-radius: 3px; font-size: 0.75rem; }
.task-status { font-weight: 600; }
.task-status.succeeded, .task-status.Success { color: #060; }
.task-status.failed, .task-status.Failed { color: #c00; }
.task-status.Queuing, .task-status.Processing, .task-status.Pending { color: #a60; }
.ts { color: #999; font-size: 0.75rem; }

.detail-json { background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; padding: 10px; font-family: monospace; font-size: 0.78rem; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }

#detail-panel { display: none; margin-top: 16px; }
#detail-panel h3 { font-size: 0.95rem; margin-bottom: 8px; }

.checkbox-label { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-weight: normal; font-size: 0.85rem; cursor: pointer; }

/* API Key header pill */
.header-row { display: flex; align-items: center; justify-content: space-between; max-width: 640px; margin-bottom: 8px; }
.header-row h1 { margin-bottom: 0; }
.key-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid #ccc; border-radius: 14px; background: #fafafa; font-size: 0.78rem; cursor: pointer; }
.key-pill:hover { background: #eee; }
.key-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
.key-pill.ok .dot { background: #4a4; }
.key-pill.missing .dot { background: #c44; }

/* Modal (native <dialog>) */
dialog { border: 1px solid #ccc; border-radius: 6px; padding: 20px 24px; width: min(520px, 92vw); box-shadow: 0 4px 16px rgba(0,0,0,0.15); color: #222; }
dialog::backdrop { background: rgba(0,0,0,0.3); }
dialog h3 { margin: 0 0 8px; font-size: 1.05rem; }
dialog .status-line { font-size: 0.82rem; color: #555; margin: 0 0 14px; line-height: 1.5; }
dialog .status-line code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; font-size: 0.78rem; word-break: break-all; }
dialog .field-label { display: block; font-size: 0.85rem; font-weight: 600; margin: 0 0 6px; color: #333; }
dialog input[type=password] { width: 100%; padding: 8px 10px; border: 1px solid #bbb; border-radius: 4px; font-size: 0.92rem; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; box-sizing: border-box; }
dialog .field-hint { font-size: 0.75rem; color: #888; margin: 6px 0 0; line-height: 1.5; }
dialog .key-msg { font-size: 0.85rem; min-height: 1.2em; margin: 10px 0 0; }
dialog .key-msg.err { color: #c00; }
dialog .key-msg.ok { color: #060; }
dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* v0.1.3b prepare/commit flow */
.ir-status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
.ir-status.rewritten { background: #e8f5e8; color: #060; }
.ir-status.fallback { background: #fff5e0; color: #a60; }
.ir-status.disabled { background: #eee; color: #666; }

details.advanced { margin-top: 12px; }
details.advanced summary { cursor: pointer; font-size: 0.85rem; color: #555; padding: 4px 0; }
details.advanced[open] summary { margin-bottom: 8px; }

#plan-panel { display: none; margin-top: 14px; padding: 12px; background: #fafafa; border: 1px solid #e0e0e0; border-radius: 4px; }
#plan-panel h4 { font-size: 0.95rem; margin-bottom: 8px; }
.plan-section { margin: 8px 0; }
.plan-section-title { font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 4px; }
.plan-warn { background: #fff8e1; border-left: 3px solid #f0a020; padding: 6px 10px; margin: 6px 0; font-size: 0.83rem; border-radius: 2px; }
.plan-segment { padding: 4px 0; font-size: 0.85rem; font-family: monospace; }
.plan-content-item { padding: 2px 0; font-size: 0.8rem; color: #444; word-break: break-all; }
.plan-content-item .kind { display: inline-block; min-width: 70px; color: #888; }
.plan-prompt-box { background: #fff; border: 1px solid #ddd; padding: 6px 8px; border-radius: 3px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; max-height: 200px; overflow-y: auto; word-break: break-all; }
.plan-prompt-toggle { font-size: 0.78rem; color: #06c; cursor: pointer; user-select: none; }
.plan-prompt-toggle:hover { text-decoration: underline; }
#plan-actions { display: flex; gap: 8px; margin-top: 12px; }

#submit-row { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
#submit-row .btn-primary { margin-right: 4px; }
</style>
</head>
<body>
<div class="header-row">
  <h1>minipic</h1>
  <button id="key-pill" class="key-pill missing" onclick="openKeyDialog()" title="点击配置 API Key">
    <span class="dot"></span><span id="key-pill-label">API Key: 未配置</span>
  </button>
</div>
<p class="sub">MiniMax H3 视频生成 · 本地 UI</p>

<dialog id="key-dialog">
  <h3>配置 API Key</h3>
  <div class="status-line" id="key-status-line">加载中…</div>
  <label class="field-label" for="key-input">输入新 Key</label>
  <input type="password" id="key-input" placeholder="eyJhbGciOi..." autocomplete="off" />
  <p class="field-hint">Key 保存在本机用户配置目录（<code id="key-save-path">%APPDATA%\minipic\config.json</code>），明文存盘。</p>
  <p class="key-msg" id="key-msg"></p>
  <div class="actions">
    <button class="btn" onclick="closeKeyDialog()">取消</button>
    <button class="btn btn-primary" id="key-save-btn" onclick="saveKey()">保存</button>
  </div>
</dialog>

<div class="card">
  <h2>创建任务</h2>

  <div class="mode-radios">
    <label><input type="radio" name="mode" value="t2v"> t2v（文生视频）</label>
    <label><input type="radio" name="mode" value="i2v"> i2v（首帧图生视频）</label>
    <label><input type="radio" name="mode" value="r2v" checked> r2v（多模态参考）</label>
  </div>

  <label for="model">模型</label>
  <select id="model">
    <option value="MiniMax-H3" selected>MiniMax-H3（默认 · 768P/2K · 4-15s）</option>
    <option value="MiniMax-H3-Max">MiniMax-H3-Max（480P/768P · 5-15s）</option>
  </select>

  <label for="prompt">提示词</label>
  <textarea id="prompt" placeholder="描述你想生成的视频内容"></textarea>

  <label for="duration">时长（秒，<span id="duration-range-label">4-15</span>）</label>
  <input type="number" id="duration" value="10" min="4" max="15">
  <span id="duration-summary" style="margin-left:8px;color:#666;font-size:0.9em;"></span>

  <label for="ratio">比例（t2v 专用）</label>
  <select id="ratio">
    <option value="">-- 选择比例 --</option>
    <option value="adaptive">adaptive</option>
    <option value="16:9">16:9</option>
    <option value="9:16">9:16</option>
    <option value="1:1">1:1</option>
    <option value="4:3">4:3</option>
    <option value="3:4">3:4</option>
    <option value="21:9">21:9</option>
  </select>

  <label for="resolution">分辨率</label>
  <select id="resolution">
    <option value="768P" selected>768P</option>
    <option value="2K">2K</option>
    <option value="480P">480P</option>
  </select>

  <!-- i2v: one image row -->
  <div id="i2v-row" style="display:none">
    <label>首帧图路径</label>
    <div class="ref-row" id="i2v-ref-row">
      <input type="text" placeholder="/path/to/image.png">
      <select>
        <option value="first_frame" selected>first_frame</option>
      </select>
      <button type="button" class="btn btn-small" onclick="pickFile(this, 'image/png,image/jpeg,image/webp')">📎</button>
      <input type="file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="uploadFile(this)">
    </div>
  </div>

  <!-- r2v: dynamic media rows -->
  <div id="r2v-section" style="display:none">
    <div class="media-section">
      <span>参考图：</span>
      <button class="btn btn-small" onclick="addRef('image')">+ 图片</button>
    </div>
    <div id="ref-images"></div>

    <div class="media-section">
      <span>参考视频：</span>
      <button class="btn btn-small" onclick="addRef('video')">+ 视频</button>
    </div>
    <div id="ref-videos"></div>

    <div class="media-section">
      <span>参考音频：</span>
      <button class="btn btn-small" onclick="addRef('audio')">+ 音频</button>
    </div>
    <div id="ref-audios"></div>
  </div>

  <label class="checkbox-label">
    <input type="checkbox" id="wait">
    <span>等待结果（阻塞请求直到视频生成完成，可能需要 15-30 分钟）</span>
  </label>

  <div id="submit-row">
    <button class="btn btn-primary" id="submit-btn" onclick="onSubmitClick()">准备 + 提交</button>
    <span id="msg"></span>
    <span id="ir-pill" class="ir-status disabled" style="margin-left:auto" title="Context-IR prompt rewrite">Context-IR: 默认开</span>
  </div>

  <details class="advanced">
    <summary>高级</summary>
    <label class="checkbox-label">
      <input type="checkbox" id="use-context-ir" checked>
      <span>使用 Context-IR 改写提示词（推荐）</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="skip-confirm">
      <span>一步提交（跳过准备预览，直接调 H3）</span>
    </label>
  </details>

  <div id="plan-panel">
    <h4>准备计划 <span id="plan-prepare-id" class="task-id"></span></h4>
    <div id="plan-ir-status" class="plan-section"></div>
    <div id="plan-warnings" class="plan-section"></div>
    <div id="plan-segments" class="plan-section"></div>
    <div id="plan-content" class="plan-section"></div>
    <div id="plan-prompt-section" class="plan-section">
      <div class="plan-section-title">
        <span class="plan-prompt-toggle" id="plan-prompt-toggle">显示原 prompt ▾</span>
      </div>
      <div class="plan-prompt-box" id="plan-prompt-box" style="display:none"></div>
    </div>
    <div id="plan-actions">
      <button class="btn" onclick="cancelPlan()">取消</button>
      <button class="btn btn-primary" id="plan-commit-btn" onclick="commitPlan()">确认提交</button>
    </div>
  </div>
</div>

<div class="card" id="detail-panel">
  <h3>任务详情</h3>
  <div id="detail-json" class="detail-json"></div>
  <p style="margin-top:8px;font-size:0.85rem">
    <span id="detail-dl-btn"></span>
    <button class="btn btn-small" onclick="closeDetail()" style="margin-left:8px">关闭</button>
  </p>
</div>

<div class="card">
  <h2>最近任务 <button class="btn btn-small" onclick="loadTasks()" style="margin-left:12px">刷新</button></h2>
  <ul class="task-list" id="task-list"><li style="color:#999">加载中…</li></ul>
</div>

<script>
const BASE = '/api';
let taskCount = 0;

function $(id) { return document.getElementById(id); }

function getMode() { return document.querySelector('input[name="mode"]:checked').value; }

// Toggle visibility of mode-specific fields
document.querySelectorAll('input[name="mode"]').forEach(function(el) {
  el.addEventListener('change', updateModeUI);
});

function updateModeUI() {
  const m = getMode();
  $('i2v-row').style.display = m === 'i2v' ? 'block' : 'none';
  $('r2v-section').style.display = m === 'r2v' ? 'block' : 'none';
  $('ratio').disabled = m !== 't2v';
}
updateModeUI();

// Dynamic ref row management
function addRef(type) {
  const containerId = type === 'image' ? 'ref-images' : type === 'video' ? 'ref-videos' : 'ref-audios';
  const container = $(containerId);
  const row = document.createElement('div');
  row.className = 'ref-row';

  if (type === 'image') {
    row.innerHTML =
      '<input type="text" placeholder="/path/to/image.png">' +
      '<select>' +
        '<option value="reference_image" selected>reference_image</option>' +
        '<option value="first_frame">first_frame</option>' +
      '</select>' +
      '<button type="button" class="btn btn-small" onclick="pickFile(this, \'image/png,image/jpeg,image/webp\')">📎</button>' +
      '<input type="file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="uploadFile(this)">' +
      '<button class="btn btn-small btn-danger" onclick="this.parentNode.remove()">×</button>';
  } else if (type === 'video') {
    row.innerHTML =
      '<input type="text" placeholder="/path/to/video.mp4">' +
      '<input type="text" placeholder="clips (0:5,30:5)" title="留空自动采样">' +
      '<button type="button" class="btn btn-small" onclick="pickFile(this, \'video/mp4,video/quicktime\')">📎</button>' +
      '<input type="file" accept="video/mp4,video/quicktime" style="display:none" onchange="uploadFile(this)">' +
      '<button class="btn btn-small btn-danger" onclick="this.parentNode.remove()">×</button>';
  } else {
    row.innerHTML =
      '<input type="text" placeholder="/path/to/audio.mp3">' +
      '<button type="button" class="btn btn-small" onclick="pickFile(this, \'audio/mpeg,audio/wav\')">📎</button>' +
      '<input type="file" accept="audio/mpeg,audio/wav" style="display:none" onchange="uploadFile(this)">' +
      '<button class="btn btn-small btn-danger" onclick="this.parentNode.remove()">×</button>';
  }
  container.appendChild(row);
}

function buildPayload() {
  const mode = getMode();
  const payload = {
    mode: mode,
    model: $('model').value,
    prompt: $('prompt').value.trim(),
    duration: parseInt($('duration').value, 10),
    resolution: $('resolution').value,
    ratio: mode === 'i2v' ? null : $('ratio').value || null,
    ref_images: [],
    ref_videos: [],
    ref_audios: [],
    wait: $('wait').checked,
  };

  if (mode === 'i2v') {
    const row = $('i2v-ref-row');
    const pathInput = row.querySelector('input');
    if (pathInput.value.trim()) {
      payload.ref_images.push({ path: pathInput.value.trim(), role: 'first_frame' });
    }
  } else if (mode === 'r2v') {
    $('ref-images').querySelectorAll('.ref-row').forEach(function(row) {
      const path = row.querySelector('input').value.trim();
      if (path) {
        payload.ref_images.push({
          path: path,
          role: row.querySelector('select') ? row.querySelector('select').value : 'reference_image',
        });
      }
    });
    $('ref-videos').querySelectorAll('.ref-row').forEach(function(row) {
      const path = row.querySelector('input').value.trim();
      const clips = row.querySelectorAll('input')[1];
      if (path) {
        payload.ref_videos.push({
          path: path,
          clips: clips && clips.value.trim() || null,
        });
      }
    });
    $('ref-audios').querySelectorAll('.ref-row').forEach(function(row) {
      const path = row.querySelector('input').value.trim();
      if (path) payload.ref_audios.push({ path: path });
    });
  }
  return payload;
}

function setMsg(text, isErr) {
  const el = $('msg');
  el.textContent = text;
  el.className = isErr ? 'err' : 'ok';
}

// ============================================================ v0.1.3b prepare / commit
let currentPrepare = null;       // last /api/prepare response
let currentPreparePayload = null; // payload that was sent (for re-display)

function applyContextIrPill(usedIr, fallback) {
  const el = $('ir-pill');
  el.classList.remove('rewritten', 'fallback', 'disabled');
  if (usedIr) {
    el.classList.add('rewritten');
    el.textContent = 'Context-IR: ✓ 已改写';
  } else if (fallback) {
    el.classList.add('fallback');
    el.textContent = 'Context-IR: ⚠ 降级到原 prompt';
  } else {
    el.classList.add('disabled');
    el.textContent = 'Context-IR: 未使用';
  }
}

function renderPlan(plan) {
  $('plan-prepare-id').textContent = plan.prepare_id || '';
  applyContextIrPill(plan.used_context_ir, plan.context_ir_fallback);

  // Warnings
  const warns = $('plan-warnings');
  warns.innerHTML = '';
  (plan.warnings || []).forEach(function(w) {
    const div = document.createElement('div');
    div.className = 'plan-warn';
    div.textContent = '⚠ ' + w;
    warns.appendChild(div);
  });

  // Segments
  const segs = $('plan-segments');
  segs.innerHTML = '';
  if (plan.segments && plan.segments.length > 0) {
    const title = document.createElement('div');
    title.className = 'plan-section-title';
    title.textContent = '切点表（' + plan.estimated_segments + ' 段）';
    segs.appendChild(title);
    plan.segments.forEach(function(s) {
      const div = document.createElement('div');
      div.className = 'plan-segment';
      div.textContent =
        '段 ' + s.index + ': ' + s.start_seconds.toFixed(2) + 's + ' +
        s.duration_seconds + 's → ' + (s.ref_clip_path || '');
      segs.appendChild(div);
    });
  }

  // Content
  const content = $('plan-content');
  content.innerHTML = '';
  const contentTitle = document.createElement('div');
  contentTitle.className = 'plan-section-title';
  contentTitle.textContent = 'Content[]（送 H3 的内容）';
  content.appendChild(contentTitle);
  (plan.content_preview || []).forEach(function(item, i) {
    const div = document.createElement('div');
    div.className = 'plan-content-item';
    const kind = item.type || '?';
    let val = '';
    if (kind === 'text') {
      val = (item.text || '').slice(0, 120) +
        ((item.text || '').length > 120 ? '…' : '');
    } else if (kind === 'video_url' || kind === 'image_url' || kind === 'audio_url') {
      val = (item.url || '').slice(0, 100);
    } else {
      val = JSON.stringify(item).slice(0, 100);
    }
    div.innerHTML = '<span class="kind">[' + i + '] ' + kind + '</span>' + escHtml(val);
    content.appendChild(div);
  });

  // Prompt (collapsible — default show the enhanced one if used, original otherwise)
  const promptBox = $('plan-prompt-box');
  const promptToggle = $('plan-prompt-toggle');
  promptBox.textContent = plan.used_context_ir
    ? (plan.enhanced_prompt || '')
    : (plan.original_prompt || plan.enhanced_prompt || '');
  promptToggle.textContent = '显示 ' +
    (plan.used_context_ir ? 'Context-IR 改写' : '原 prompt') + ' ▾';

  $('plan-panel').style.display = 'block';
}

function hidePlan() {
  $('plan-panel').style.display = 'none';
  currentPrepare = null;
  currentPreparePayload = null;
}

async function onSubmitClick() {
  if ($('skip-confirm').checked) {
    return submitTaskLegacy();
  }
  return prepareTask();
}

async function prepareTask() {
  setMsg('', false);
  const payload = buildPayload();
  if (!payload.prompt) { setMsg('请填写提示词', true); return; }
  payload.use_context_ir = $('use-context-ir').checked;
  setMsg('准备中…', false);
  try {
    const res = await fetch(BASE + '/prepare', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      setMsg('准备失败: ' + (data.detail || res.status), true);
      hidePlan();
      return;
    }
    currentPrepare = data;
    currentPreparePayload = payload;
    setMsg('已准备，查看下方计划后确认提交', false);
    renderPlan(data);
  } catch(e) {
    setMsg('网络错误: ' + e.message, true);
  }
}

async function commitPlan() {
  if (!currentPrepare) return;
  const prepareId = currentPrepare.prepare_id;
  setMsg('提交中…', false);
  $('plan-commit-btn').disabled = true;
  try {
    const res = await fetch(BASE + '/commit/' + encodeURIComponent(prepareId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    const data = await res.json();
    if (!res.ok) {
      setMsg('提交失败: ' + (data.detail || res.status), true);
      return;
    }
    setMsg('已提交，task_id: ' + data.task_id, false);
    hidePlan();
    $('detail-dl-btn').innerHTML =
      '<a href="#" onclick="showTask(\'' + data.task_id + '\');return false">查看状态</a>';
    showTask(data.task_id);
    loadTasks();
  } catch(e) {
    setMsg('网络错误: ' + e.message, true);
  } finally {
    $('plan-commit-btn').disabled = false;
  }
}

function cancelPlan() {
  hidePlan();
  setMsg('已取消准备', false);
}

// Original one-shot submit (used when "skip-confirm" is checked)
async function submitTaskLegacy() {
  setMsg('', false);
  const payload = buildPayload();
  if (!payload.prompt) { setMsg('请填写提示词', true); return; }
  payload.use_context_ir = $('use-context-ir').checked;
  try {
    const res = await fetch(BASE + '/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      setMsg('错误: ' + (data.detail || data.error || res.status), true);
      return;
    }
    setMsg('已提交，task_id: ' + data.task_id, false);
    $('detail-dl-btn').innerHTML =
      '<a href="#" onclick="showTask(\'' + data.task_id + '\');return false">查看状态</a>';
    showTask(data.task_id);
    loadTasks();
  } catch(e) {
    setMsg('网络错误: ' + e.message, true);
  }
}

// Keep `submitTask` as an alias for backward-compat in case any browser
// extension / automation still calls the old function name.
async function submitTask() { return onSubmitClick(); }

// ============================================================ v0.1.4 file upload helpers
async function uploadFile(fileInput) {
  const file = fileInput.files[0]; if (!file) return;
  const btn = fileInput.previousElementSibling;
  // text input is always the first <input type=text> sibling of the picker button
  const txtInput = fileInput.parentNode.querySelector('input[type=text]');
  const isVideo = /^video\//.test(file.type);
  const origText = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳';
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await fetch(BASE + '/upload', { method: 'POST', body: fd });
    if (!r.ok) {
      let msg = r.statusText;
      try { msg = (await r.json()).detail || msg; } catch (_) {}
      throw new Error(msg);
    }
    const data = await r.json();
    if (txtInput) txtInput.value = data.path;
    // For video uploads, auto-fill the duration input only if the user hasn't
    // typed one yet. Probe via /api/probe/video (ffprobe under the hood).
    if (isVideo) maybeAutofillDuration(data.path);
    updateDurationSummary();
  } catch (e) { alert('上传失败: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = origText; fileInput.value = ''; }
}

async function maybeAutofillDuration(path) {
  const durInput = document.getElementById('duration');
  if (!durInput) return;
  try {
    const r = await fetch(BASE + '/probe/video?path=' + encodeURIComponent(path));
    if (!r.ok) return;  // probe is best-effort; silently skip on failure.
    const data = await r.json();
    const seconds = Number(data.duration);
    if (!Number.isFinite(seconds) || seconds <= 0) return;
    // Clamp to model max (15s for H3) — single segments can't exceed that.
    const capped = Math.min(15, Math.max(5, Math.round(seconds)));
    durInput.value = String(capped);
    if (seconds > 15.5) {
      alert(`参考视频 ${seconds.toFixed(1)}s 已自动填入单段上限 15s；将走多段生成`);
    }
    updateDurationSummary();
  } catch (_) { /* silent */ }
}

function pickFile(btn, accept) {
  const fi = btn.nextElementSibling;
  if (accept) fi.accept = accept;
  fi.click();
}

async function loadTasks() {
  try {
    const res = await fetch(BASE + '/tasks');
    const tasks = await res.json();
    const ul = $('task-list');
    if (!tasks || tasks.length === 0) {
      ul.innerHTML = '<li style="color:#999">暂无任务</li>';
      return;
    }
    ul.innerHTML = tasks.map(function(t) {
      const time = new Date(t.submitted_at).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});
      const dl = (t.output_path || (t.status === 'Success' || t.status === 'succeeded'))
        ? '<a href="#" onclick="downloadTask(\'' + t.task_id + '\');return false">下载</a>'
        : '';
      return '<li>' +
        '<span class="task-id">' + escHtml(t.task_id) + '</span> ' +
        '<span class="task-mode">' + escHtml(t.mode) + '</span> ' +
        '<span class="task-status ' + escHtml(t.status) + '">' + escHtml(t.status) + '</span> ' +
        '<span class="ts">' + time + '</span> ' +
        '<a href="#" onclick="showTask(\'' + t.task_id + '\');return false">详情</a> ' +
        dl +
      '</li>';
    }).join('');
  } catch(e) {
    $('task-list').innerHTML = '<li style="color:#c00">加载失败: ' + escHtml(e.message) + '</li>';
  }
}

async function showTask(taskId) {
  try {
    const res = await fetch(BASE + '/tasks/' + taskId);
    if (!res.ok) {
      alert('任务不存在'); return;
    }
    const t = await res.json();
    $('detail-json').textContent = JSON.stringify(t, null, 2);
    let dl = '';
    const url = t.content_url || t.output_path;
    if (url) {
      dl = '<a href="/api/tasks/' + taskId + '/download">下载视频</a>';
    }
    $('detail-dl-btn').innerHTML = dl;
    $('detail-panel').style.display = 'block';
  } catch(e) {
    alert('加载失败: ' + e.message);
  }
}

function closeDetail() { $('detail-panel').style.display = 'none'; }

function downloadTask(taskId) {
  window.location.href = '/api/tasks/' + taskId + '/download';
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Poll
loadTasks();
setInterval(loadTasks, 5000);

// -------- API Key dialog --------
let modelConstraints = null;  // populated by loadConfigStatus()

function updateDurationSummary() {
  const summary = $('duration-summary');
  if (!summary) return;
  const refPaths = Array.from(document.querySelectorAll('#ref-videos .ref-row input[type=text]'))
    .map(function(i) { return i.value.trim(); })
    .filter(Boolean);
  if (refPaths.length === 0) {
    summary.textContent = '';
    return;
  }
  const seconds = parseInt($('duration').value, 10);
  if (!Number.isFinite(seconds) || seconds <= 0) {
    summary.textContent = '';
    return;
  }
  // Probe the first reference video's duration (best-effort).
  fetch(BASE + '/probe/video?path=' + encodeURIComponent(refPaths[0]))
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      if (!d || !Number.isFinite(d.duration)) { summary.textContent = ''; return; }
      const ref = d.duration;
      const segs = Math.min(4, Math.max(1, Math.ceil(ref / seconds)));
      const total = segs * seconds;
      summary.textContent = '预计输出 ≈ ' + segs + ' 段 × ' + seconds + 's = ' + total + 's';
    })
    .catch(function() { summary.textContent = ''; });
}

function applyModelConstraints() {
  if (!modelConstraints) return;
  const model = $('model').value;
  const c = modelConstraints[model];
  if (!c) return;

  // duration range
  const dur = $('duration');
  dur.min = c.duration_min;
  dur.max = c.duration_max;
  $('duration-range-label').textContent = c.duration_min + '-' + c.duration_max;
  if (parseInt(dur.value, 10) < c.duration_min) dur.value = c.duration_min;
  if (parseInt(dur.value, 10) > c.duration_max) dur.value = c.duration_max;

  // resolution options — keep only the ones this model supports
  const res = $('resolution');
  const prev = res.value;
  res.innerHTML = '';
  c.resolutions.forEach(function(r, i) {
    const opt = document.createElement('option');
    opt.value = r;
    opt.textContent = r;
    if ((i === 0 && !c.resolutions.includes(prev)) || r === prev) {
      opt.selected = true;
    } else if (i === 0) {
      opt.selected = true;
    }
    res.appendChild(opt);
  });
  updateDurationSummary();
}

async function loadConfigStatus() {
  try {
    const res = await fetch(BASE + '/config');
    if (!res.ok) return;
    const cfg = await res.json();
    // Build modelConstraints map
    modelConstraints = {};
    cfg.models.forEach(function(m) {
      modelConstraints[m.name] = {
        resolutions: m.resolutions,
        duration_min: m.duration_min,
        duration_max: m.duration_max,
      };
    });
    // Update pill
    const pill = $('key-pill');
    const lbl = $('key-pill-label');
    if (cfg.has_key) {
      pill.classList.remove('missing');
      pill.classList.add('ok');
      const srcLabel = cfg.source === 'env' ? '（env 优先 · UI 改动不生效）'
                    : cfg.source === 'local' ? '（local config.json）'
                    : cfg.source === 'user'  ? '（用户配置）'
                    : '';
      lbl.textContent = 'API Key: ' + cfg.masked + ' ' + srcLabel;
      pill.title = '来源: ' + cfg.source;
    } else {
      pill.classList.remove('ok');
      pill.classList.add('missing');
      lbl.textContent = 'API Key: 未配置 · 点击填写';
    }
    // Save path hint
    const p = $('key-save-path');
    if (p && cfg.user_config_path) p.textContent = cfg.user_config_path;

    applyModelConstraints();
  } catch(e) { /* ignore */ }
}

function openKeyDialog() {
  $('key-input').value = '';
  $('key-msg').textContent = '';
  $('key-msg').className = '';
  $('key-status-line').textContent = '请输入你的 MiniMax API Key';
  $('key-dialog').showModal();
  setTimeout(function() { $('key-input').focus(); }, 50);
}

function closeKeyDialog() {
  $('key-dialog').close();
}

async function saveKey() {
  const key = $('key-input').value.trim();
  if (!key) { setKeyMsg('请输入 Key', true); return; }
  const btn = $('key-save-btn');
  btn.disabled = true;
  btn.textContent = '保存中…';
  try {
    const res = await fetch(BASE + '/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ api_key: key }),
    });
    const data = await res.json();
    if (!res.ok) { setKeyMsg('保存失败: ' + (data.detail || res.status), true); return; }
    setKeyMsg('已保存到 ' + data.saved_to, false);
    $('key-input').value = '';
    await loadConfigStatus();
    setTimeout(closeKeyDialog, 600);
  } catch(e) {
    setKeyMsg('网络错误: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
  }
}

function setKeyMsg(text, isErr) {
  const el = $('key-msg');
  el.textContent = text;
  el.className = 'key-msg ' + (isErr ? 'err' : 'ok');
}

// Wire model select
$('model').addEventListener('change', applyModelConstraints);

// Wire duration input — recompute segment preview on every keystroke.
$('duration').addEventListener('input', updateDurationSummary);

// v0.1.3b: Context-IR checkbox live updates the status pill
$('use-context-ir').addEventListener('change', function() {
  if (this.checked) {
    applyContextIrPill(false, false);
    $('ir-pill').textContent = 'Context-IR: 默认开';
  } else {
    applyContextIrPill(false, false);
    $('ir-pill').textContent = 'Context-IR: 已禁用';
  }
});

// v0.1.3b: prompt toggle in the plan panel
$('plan-prompt-toggle').addEventListener('click', function() {
  const box = $('plan-prompt-box');
  if (box.style.display === 'none') {
    box.style.display = 'block';
    this.textContent = this.textContent.replace('▾', '▴');
  } else {
    box.style.display = 'none';
    this.textContent = this.textContent.replace('▴', '▾');
  }
});

loadConfigStatus();
