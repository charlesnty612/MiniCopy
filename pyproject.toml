[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minipic"
version = "0.2.1"
description = "Local CLI + web UI for MiniMax H3 video generation (T2V / I2V / R2V)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "minipic contributors" }]
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "rich>=13.7",
    # Portability: bundle a static ffmpeg binary (no system install needed)
    "imageio-ffmpeg>=0.5",
    # Portability: cross-platform config / data dirs (XDG / APPDATA)
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "pyinstaller>=6.0",
]

[project.scripts]
minipic = "minipic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true
